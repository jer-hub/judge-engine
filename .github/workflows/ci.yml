name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: judge_engine
          POSTGRES_USER: judge
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U judge -d judge_engine"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: "True"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge_engine
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: ci_password
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches backend/Dockerfile
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - run: pip install -r requirements.txt -c requirements.lock
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (Docker is mocked; no sandbox needed)
        run: python manage.py test

  frontend:
    name: Frontend lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20" # matches frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  images:
    name: Docker images and compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid (dev and prod)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build -t judge-backend:ci backend
      - name: Build frontend production image
        run: docker build --target runner -t judge-frontend:ci frontend
