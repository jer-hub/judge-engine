# Rotate container logs (Docker's default json-file driver never does).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Celery worker is answering its control channel.
x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "celery -A config inspect ping -d $${CELERY_NODE}@$$HOSTNAME --timeout 10 | grep -q pong"]
  interval: 30s
  timeout: 20s
  start_period: 30s
  retries: 3

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judge_engine}
      POSTGRES_USER: ${POSTGRES_USER:-judge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-judge_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only - never expose the database to the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-judge} -d ${POSTGRES_DB:-judge_engine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    logging: *default-logging
    # Loopback only - Redis has no auth and is the Celery broker.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    logging: *default-logging
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py bootstrap_admin --username $${BOOTSTRAP_ADMIN_USER:-admin} --password $${BOOTSTRAP_ADMIN_PASSWORD:-JudgeDev-Admin-ChangeMe!} || true &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Bootstrap credentials come from .env (see .env.example). Do not hardcode here.
    volumes:
      - ./backend:/app
      - media_data:/app/media
    # Loopback by default: dev runs with DEBUG and a published admin password.
    # Set DEV_BIND=0.0.0.0 in .env to reach it from other PCs on purpose.
    ports:
      - "${DEV_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      # Host "backend" must be in DJANGO_ALLOWED_HOSTS (it is in .env.example).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/healthz/', headers={'Host': 'backend'}), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    logging: *default-logging
    # Root: needs the Docker socket (root-equivalent regardless of the user).
    user: "0"
    # -B: embedded beat runs the stuck-submission recovery sweep every minute.
    # Only one judge worker may run it, so do not scale this service.
    command: celery -A config worker -B --schedule /tmp/celerybeat-schedule -Q judge,celery --loglevel=info --concurrency=2 -n judge@%h
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JUDGE_DATA_DIR: /judge_data
      # Empty: the worker asks Docker which host folder backs /judge_data.
      JUDGE_HOST_DATA_DIR: ${JUDGE_HOST_DATA_DIR:-}
      CELERY_NODE: judge
    volumes:
      - ./backend:/app
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck: *worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # Practice "Run" previews only, so they never delay graded submissions.
  worker-preview:
    build:
      context: ./backend
    logging: *default-logging
    user: "0"
    command: celery -A config worker -Q preview --loglevel=info --concurrency=1 -n preview@%h
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JUDGE_DATA_DIR: /judge_data
      # Empty: the worker asks Docker which host folder backs /judge_data.
      JUDGE_HOST_DATA_DIR: ${JUDGE_HOST_DATA_DIR:-}
      CELERY_NODE: preview
    volumes:
      - ./backend:/app
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck: *worker-healthcheck
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations run in the backend's startup command.
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    logging: *default-logging
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
      JWT_COOKIE_SECURE: "false"
      # Cookie lifetimes must match the backend's token lifetimes.
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      # Docker Desktop on Windows/macOS does not forward file-change events
      # into bind mounts, so without polling edits never hot-reload.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Keep the container's dev build output separate from the host's, so a
      # host `npm run build` doesn't clobber the running dev server.
      - frontend_next:/app/.next
    ports:
      - "${DEV_BIND:-127.0.0.1}:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
  frontend_next:
