# Production-oriented overrides (use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d)
# Requires Docker Compose >= 2.24 for the !reset / !override tags, which drop
# dev-only ports and source bind-mounts instead of merging with them.
services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  backend:
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      # TLS ends at Caddy; trust its X-Forwarded-Proto so Django knows it is HTTPS.
      DJANGO_BEHIND_TLS_PROXY: "True"
    # Run the code baked into the image, not the host checkout.
    volumes: !override
      - media_data:/app/media
    # Reached only through Caddy (and the frontend, on the compose network).
    ports: !reset []

  worker:
    restart: unless-stopped
    command: celery -A config worker -Q judge,celery --loglevel=info --concurrency=${JUDGE_CONCURRENCY:-4} -n judge@%h
    environment:
      DJANGO_DEBUG: "False"
    volumes: !override
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock

  worker-preview:
    restart: unless-stopped
    command: celery -A config worker -Q preview --loglevel=info --concurrency=${JUDGE_PREVIEW_CONCURRENCY:-2} -n preview@%h
    environment:
      DJANGO_DEBUG: "False"
    volumes: !override
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        # Same-origin behind Caddy (Django admin link becomes /admin/).
        NEXT_PUBLIC_API_URL: ""
    command: ["node", "server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      JWT_COOKIE_SECURE: "true"
    # Run the built image, not the host checkout (no node_modules volume either).
    volumes: !reset []
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
