# Production-oriented overrides (use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d)
# Requires Docker Compose >= 2.24 for the !reset / !override tags, which drop
# dev-only ports and source bind-mounts instead of merging with them.
# Every service has a memory and CPU cap (overridable in .env), so a runaway
# process cannot starve Postgres or the judge. CPU caps default to at most 1,
# since Docker refuses a cap above the host's cores; raise *_CPUS on bigger hosts. Sandboxes are capped separately
# (1 CPU and the problem's memory each): keep JUDGE_CONCURRENCY +
# JUDGE_PREVIEW_CONCURRENCY below the host's cores.
services:
  db:
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1}
    ports: !reset []
    restart: unless-stopped

  redis:
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    ports: !reset []
    restart: unless-stopped
    # Persist the queue: without it, recreating Redis drops queued judging
    # (the recovery sweep would re-queue it, but only after the stale window).
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1}
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             if [ -n \"$$BOOTSTRAP_ADMIN_PASSWORD\" ]; then
               python manage.py bootstrap_admin --username $${BOOTSTRAP_ADMIN_USER:-admin};
             else
               echo 'BOOTSTRAP_ADMIN_PASSWORD not set: no admin account created';
             fi &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "False"
      # TLS ends at Caddy; trust its X-Forwarded-Proto so Django knows it is HTTPS.
      DJANGO_BEHIND_TLS_PROXY: "True"
    # Run the code baked into the image, not the host checkout.
    volumes: !override
      - media_data:/app/media
    # Reached only through Caddy (and the frontend, on the compose network).
    ports: !reset []

  worker:
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1}
    restart: unless-stopped
    # -B: embedded beat for the recovery sweep (one judge worker only).
    command: celery -A config worker -B --schedule /tmp/celerybeat-schedule -Q judge,celery --loglevel=info --concurrency=${JUDGE_CONCURRENCY:-4} -n judge@%h
    environment:
      DJANGO_DEBUG: "False"
    volumes: !override
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock

  worker-preview:
    mem_limit: ${PREVIEW_WORKER_MEM_LIMIT:-384m}
    cpus: ${PREVIEW_WORKER_CPUS:-0.5}
    restart: unless-stopped
    command: celery -A config worker -Q preview --loglevel=info --concurrency=${JUDGE_PREVIEW_CONCURRENCY:-2} -n preview@%h
    environment:
      DJANGO_DEBUG: "False"
    volumes: !override
      - ./judge_data:/judge_data
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-1}
    build:
      context: ./frontend
      target: runner
      args:
        # Same-origin behind Caddy (Django admin link becomes /admin/).
        NEXT_PUBLIC_API_URL: ""
    command: ["node", "server.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      JWT_COOKIE_SECURE: "true"
    # Run the built image, not the host checkout (no node_modules volume either).
    volumes: !reset []
    ports: !reset []

  # Nightly compressed pg_dump into ./backups, keeping BACKUP_KEEP_DAYS days.
  # Restore steps: docs/BACKUPS.md. Copy ./backups off this machine too.
  db-backup:
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    cpus: ${BACKUP_CPUS:-0.5}
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-judge}
      PGPASSWORD: ${POSTGRES_PASSWORD:-judge_dev_password}
      PGDATABASE: ${POSTGRES_DB:-judge_engine}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          file="/backups/$${PGDATABASE}-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump --format=custom --file="$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "backup ok: $$file ($$(du -h "$$file" | cut -f1))"
          else
            rm -f "$$file.partial"
            echo "backup FAILED" >&2
          fi
          find /backups -name '*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    cpus: ${CADDY_CPUS:-0.5}
    image: caddy:2-alpine
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
